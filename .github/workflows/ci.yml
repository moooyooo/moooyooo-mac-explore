name: macOS build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Record toolchain
        run: |
          sw_vers
          swift --version
          xcode-select -p
      - name: Check translations
        run: python3 scripts/check-localizations.py
      - name: Build app
        run: scripts/build-app.sh release
      - name: Test including real app processes and packaged languages
        run: scripts/test.sh --integration
      - name: Test separate APFS volume and real disk-full failure
        run: scripts/test-volumes.sh
      - name: Verify development distribution
        run: scripts/package-release.sh --development
      - name: Check whitespace
        run: git diff --check
      - name: Keep verified development artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: development-${{ matrix.os }}-${{ runner.arch }}
          path: |
            dist/*.zip
            dist/*.sha256
            dist/*.build.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
